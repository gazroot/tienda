<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archivo // AURA NØIR</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            width: 100%;
            border-bottom: 1px solid #2b2b2b;
            padding: 22px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.96);
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        nav {
            display: flex;
            gap: 30px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        nav a:hover {
            color: #aaa;
        }

        .bag {
            border: 1px solid #444;
            padding: 9px 14px;
        }

        .cart-count {
            margin-left: 5px;
            color: #aaa;
        }

        main {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 0 100px;
        }

        .catalog-header {
            margin-bottom: 50px;
        }

        .catalog-header span {
            font-size: 11px;
            color: #777;
            letter-spacing: 3px;
        }

        .catalog-header h1 {
            font-size: 45px;
            letter-spacing: 4px;
            margin-top: 15px;
        }

        .catalog-header p {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }

        #estado-catalogo {
            margin-bottom: 25px;
            color: #777;
            font-size: 12px;
            letter-spacing: 1px;
        }

        #product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            border: 1px solid #252525;
            background: #0e0e0e;
            transition: 0.3s ease;
            overflow: hidden;
        }

        .product-card:hover {
            border-color: #666;
            transform: translateY(-4px);
        }

        .product-image {
            height: 350px;
            background: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            letter-spacing: 3px;
            font-size: 12px;
        }

        .product-info {
            padding: 22px;
        }

        .product-category {
            color: #666;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .product-name {
            font-size: 17px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .product-description {
            color: #777;
            font-size: 12px;
            line-height: 1.6;
            min-height: 40px;
            margin-bottom: 15px;
        }

        .product-price {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .product-stock {
            color: #777;
            font-size: 11px;
            margin-bottom: 18px;
        }

        .product-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 1px solid #555;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        button:hover {
            background: white;
            color: black;
        }

        .details-btn {
            background: white;
            color: black;
        }

        .details-btn:hover {
            background: #ccc;
        }

        .loading,
        .error,
        .empty {
            grid-column: 1 / -1;
            padding: 50px;
            text-align: center;
            border: 1px solid #252525;
            color: #777;
        }

        footer {
            border-top: 1px solid #252525;
            padding: 30px 5%;
            color: #555;
            font-size: 11px;
            letter-spacing: 1px;
            text-align: center;
        }

        #status-toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #ffffff;
            color: #000000;
            padding: 16px 22px;
            z-index: 9999;
            display: none;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        @media (max-width: 1100px) {
            #product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {
            #product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            nav {
                gap: 12px;
            }

            .catalog-header h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 550px) {
            #product-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="inicio.html" class="logo">
        AURA // NØIR
    </a>

    <nav>
        <a href="inicio.html">INICIO</a>
        <a href="catalogo.html">Archivo</a>

        <a href="carrito.html" class="bag" data-path="bag">
            BOLSA
            [<span class="cart-count">0</span>]
        </a>
    </nav>

</header>


<main>

    <section class="catalog-header">

        <span>01 // COLLECTION</span>

        <h1>Archivo</h1>

        <p>
            Explora todos los productos disponibles de AURA // NØIR.
        </p>

    </section>


    <div id="estado-catalogo">
        CARGANDO PRODUCTOS...
    </div>


    <section id="product-grid">

        <div class="loading">
            CONECTANDO CON LA BASE DE DATOS...
        </div>

    </section>

</main>


<footer>
    AURA // NØIR — SYSTEM / GARMENTS / 2026
</footer>


<div id="status-toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>

// La conexión ahora se hace directamente con Supabase.
const db = () => window.auraSupabase;


// =====================================================
// CARGAR PRODUCTOS DESDE LA BASE DE DATOS
// =====================================================

async function cargarProductos() {

    const productGrid = document.getElementById("product-grid");
    const estado = document.getElementById("estado-catalogo");

    try {

        if (!db()) {
            throw new Error("Falta configurar Supabase en supabase-config.js.");
        }

        const { data: filas, error } = await db()
            .from("productos")
            .select("id_producto,nombre,descripcion,precio,stock,imagen,categorias(nombre)")
            .order("id_producto", { ascending: true });

        if (error) throw error;

        const productos = (filas || []).map(p => ({
            ...p,
            categoria: p.categorias?.nombre || "SIN CATEGORÍA"
        }));

        productGrid.innerHTML = "";

        if (productos.length === 0) {

            estado.textContent = "NO HAY PRODUCTOS DISPONIBLES.";

            productGrid.innerHTML = `
                <div class="empty">
                    NO HAY PRODUCTOS CON STOCK DISPONIBLE.
                </div>
            `;

            return;
        }


        estado.textContent =
            `${productos.length} PRODUCTOS DISPONIBLES`;


        productos.forEach(producto => {

            const tarjeta = document.createElement("article");

            tarjeta.className = "product-card";


            const precio = Number(producto.precio)
                .toLocaleString("es-CO", {
                    maximumFractionDigits: 0
                });


            tarjeta.innerHTML = `

                <div class="product-image">
                    AURA // NØIR
                </div>

                <div class="product-info">

                    <div class="product-category">
                        ${producto.categoria || "SIN CATEGORÍA"}
                    </div>

                    <h2 class="product-name">
                        ${producto.nombre}
                    </h2>

                    <p class="product-description">
                        ${producto.descripcion || "Sin descripción disponible."}
                    </p>

                    <div class="product-price">
                        $ ${precio} COP
                    </div>

                    <div class="product-stock">
                        STOCK DISPONIBLE:
                        ${producto.stock}
                    </div>

                    <div class="product-buttons">

                        <button
                            class="details-btn"
                            onclick="verProducto(${producto.id_producto})"
                        >
                            VER PRODUCTO
                        </button>

                        <button
                            onclick="agregarAlCarrito(
                                ${producto.id_producto},
                                '${escaparTexto(producto.nombre)}',
                                ${producto.precio},
                                ${producto.stock}
                            )"
                        >
                            AÑADIR A LA BOLSA
                        </button>

                    </div>

                </div>
            `;


            productGrid.appendChild(tarjeta);

        });

    } catch (error) {

        console.error(error);

        estado.textContent =
            "ERROR DE CONEXIÓN CON EL SERVIDOR.";

        productGrid.innerHTML = `
            <div class="error">

                <h3>NO SE PUDO CARGAR EL CATÁLOGO</h3>

                <br>

                <p>
                    Verifica que supabase-config.js tenga la URL del proyecto y la clave pública correctas,
                    y que ejecutaste supabase_schema.sql en Supabase.
                </p>

            </div>
        `;
    }
}


// =====================================================
// VER PRODUCTO
// =====================================================

function verProducto(id) {

    window.location.href =
        `modelo.html?id=${id}`;

}


// =====================================================
// AÑADIR AL CARRITO
// =====================================================

function agregarAlCarrito(
    id,
    nombre,
    precio,
    stock
) {

    let carrito =
        JSON.parse(
            localStorage.getItem("aura_noir_cart")
        ) || [];


    const productoExistente =
        carrito.find(
            producto => producto.id == id
        );


    if (productoExistente) {

        if (productoExistente.cantidad >= stock) {

            mostrarMensaje(
                "NO HAY MÁS UNIDADES DISPONIBLES"
            );

            return;
        }


        productoExistente.cantidad++;

    } else {

        carrito.push({

            id: id,

            nombre: nombre,

            precio: Number(precio),

            cantidad: 1

        });

    }


    localStorage.setItem(
        "aura_noir_cart",
        JSON.stringify(carrito)
    );


    actualizarContadorCarrito();


    mostrarMensaje(
        `${nombre} AÑADIDO A LA BOLSA`
    );
}


// =====================================================
// ACTUALIZAR CONTADOR
// =====================================================

function actualizarContadorCarrito() {

    const carrito =
        JSON.parse(
            localStorage.getItem("aura_noir_cart")
        ) || [];


    const cantidad =
        carrito.reduce(
            (total, producto) =>
                total + producto.cantidad,
            0
        );


    const contador =
        document.querySelector(".cart-count");


    if (contador) {

        contador.textContent = cantidad;

    }
}


// =====================================================
// MENSAJE
// =====================================================

function mostrarMensaje(texto) {

    const toast =
        document.getElementById("status-toast");


    toast.textContent = texto;

    toast.style.display = "block";


    setTimeout(() => {

        toast.style.display = "none";

    }, 2500);

}


// =====================================================
// EVITAR PROBLEMAS CON COMILLAS EN LOS NOMBRES
// =====================================================

function escaparTexto(texto) {

    return String(texto)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


// =====================================================
// INICIAR
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        cargarProductos();

        actualizarContadorCarrito();

    }
);

</script>

</body>
</html>
